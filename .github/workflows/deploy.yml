name: Deploy

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-2   # 시드니. Terraform region과 같아야 합니다
  ECR_REPOSITORY: station-be
  CODEDEPLOY_APP: station
  CODEDEPLOY_GROUP: station-dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 키 방식은 OIDC처럼 AWS 쪽에서 브랜치를 제한할 수 없으므로, 수동 실행도 dev에서만 돌게 막습니다.
    if: github.ref == 'refs/heads/dev'
    steps:
      - uses: actions/checkout@v7

      # 조직 SCP가 GitHub OIDC 공급자를 막아서 최소 권한 IAM 사용자(station-github-deploy)의 액세스 키를 씁니다.
      # OIDC로 되돌릴 때: Terraform auth_mode = "oidc", 아래를 role-to-assume: ${{ secrets.AWS_ROLE_ARN }}로,
      # permissions에 id-token: write 추가 (docs/INFRA.md 6장)
      - name: AWS 로그인 (IAM 사용자 액세스 키)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR 로그인
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v4

      - name: 이미지 빌드 & ECR push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # attestation(provenance) 매니페스트를 만들지 않습니다. 켜 두면 ECR에 태그 없는 항목이 이미지마다 쌓입니다.
          provenance: false

      - name: 배포 번들(zip) 만들기
        run: |
          mkdir -p bundle
          cp -r deploy/appspec.yml deploy/docker-compose.yml deploy/Caddyfile deploy/scripts bundle/
          chmod +x bundle/scripts/*.sh   # zip에 실행 권한을 담아 CodeDeploy 훅이 바로 실행되게
          echo "IMAGE_URI=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}" > bundle/image.env
          cd bundle && zip -qr ../bundle.zip .

      - name: S3 업로드
        run: aws s3 cp bundle.zip "s3://${{ secrets.DEPLOY_BUCKET }}/station/${{ github.sha }}.zip"

      - name: CodeDeploy 배포 & 완료 대기
        run: |
          DEPLOYMENT_ID=$(aws deploy create-deployment \
            --application-name "$CODEDEPLOY_APP" \
            --deployment-group-name "$CODEDEPLOY_GROUP" \
            --s3-location bucket=${{ secrets.DEPLOY_BUCKET }},key=station/${{ github.sha }}.zip,bundleType=zip \
            --description "${{ github.sha }}" \
            --query deploymentId --output text)
          echo "deployment: $DEPLOYMENT_ID"
          aws deploy wait deployment-successful --deployment-id "$DEPLOYMENT_ID"
