name: CI

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest   # Docker가 기본 설치되어 있어 Testcontainers가 그대로 동작
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build & Test
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
