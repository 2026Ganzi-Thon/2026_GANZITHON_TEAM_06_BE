version: 0.0
os: linux
files:
  - source: /
    destination: /home/ubuntu/station/current
file_exists_behavior: OVERWRITE
hooks:
  AfterInstall:
    - location: scripts/start.sh
      timeout: 300
      runas: root
  ValidateService:
    - location: scripts/validate.sh
      timeout: 180
      runas: root
