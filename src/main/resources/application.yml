# 설정은 세 구역입니다.
#   1) 공통: 모든 환경에서 같은 값
#   2) local: 로컬 개발. 기본값이 있어서 아무것도 안 해도 뜹니다. 루트의 .env가 있으면 그 값이 우선
#   3) prod: 배포. 환경마다 다른 값은 기본값 없이 환경변수로만 받습니다 (빠지면 시작 실패)
spring:
  application:
    name: station
  profiles:
    default: local

  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # 스키마는 Flyway(db/migration)가 만들고, JPA는 검증만 합니다
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

# 배포 검증용으로 /actuator/health 하나만 엽니다. 상세 정보는 내보내지 않습니다.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

station:
  jwt:
    expiration: 7d                # 계정 토큰 유효 기간. 리프레시 토큰 없음
  realtime:
    seat-count: ${SEAT_COUNT:20}  # 대기실 하나의 좌석 수. 다 차면 서서 기다림
    broadcast-cooldown: 30s       # 승객 한 명의 방송 간격 (BR-01)
    broadcast-display: 15s        # 전광판 노출 시간 = 대기열 송출 간격 (BR-02)
    broadcast-queue-size: 20      # 대기실 하나의 방송 대기열 상한

---
# 로컬 개발: docker-compose.yml의 Postgres 기본값과 맞춰 두었습니다.
spring:
  config:
    activate:
      on-profile: local
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${DB_PORT:5432}/${DB_NAME:station}}
    username: ${DB_USERNAME:station}
    password: ${DB_PASSWORD:station}

  jpa:
    properties:
      hibernate:
        format_sql: true

station:
  jwt:
    # 로컬 전용 값. 배포에서는 절대 쓰지 않습니다.
    secret: ${JWT_SECRET:local-only-secret-change-me-0123456789abcdef}
  train:
    # 1시간을 몇 초로 줄일지. 15초 → 15초마다 열차 1대 = 털실 1올
    interval-seconds: ${TRAIN_INTERVAL_SECONDS:15}
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:http://localhost:*}

logging:
  level:
    org.hibernate.SQL: debug

---
# 배포: .env 파일을 읽지 않습니다. 아래 환경변수를 서버(Docker Compose)에서 넣어 줍니다.
#   SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
#     → Spring이 spring.datasource.* 로 자동으로 읽습니다. 없으면 시작 실패
#   JWT_SECRET, CORS_ALLOWED_ORIGINS, TRAIN_INTERVAL_SECONDS → 기본값 없음
spring:
  config:
    activate:
      on-profile: prod

server:
  forward-headers-strategy: framework   # 리버스 프록시 뒤에서 원래 주소·프로토콜(X-Forwarded-*)을 씁니다

station:
  jwt:
    secret: ${JWT_SECRET}
  train:
    interval-seconds: ${TRAIN_INTERVAL_SECONDS}
  cors:
    # 쉼표로 여러 개, 패턴 가능. 권장값: "https://{프론트 주소},http://localhost:*"
    # (프론트 개발자가 로컬 화면에서 배포된 dev 서버를 부르기 때문에 localhost도 허용)
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS}
